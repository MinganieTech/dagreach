[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dagreach"
dynamic = ["version"]
description = "Impact analysis for any DAG — what a change reaches, offline, in CI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benoit De Mulder", email = "bdemulder@gmail.com" }]
keywords = ["dag", "graph", "impact-analysis", "dot", "graphviz", "ci", "dependency-graph"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
# No runtime dependencies yet. NetworkX arrives with the analysis core (T2).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
dagreach = "dagreach.cli:main"

[tool.hatch.version]
path = "src/dagreach/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
