name: dagreach
description: >-
  Portable change-impact analysis for dependency graphs. See what a change can reach,
  why it reaches it, and whether CI should allow it.
author: Minganie Technologies

branding:
  icon: git-branch
  color: blue

inputs:
  version:
    description: >-
      the released tag to run, e.g. v0.1.0-rc.1. Pin it to a tag you have looked
      at: the checksum proves the download arrived intact, not that the release
      is what its author meant to publish.
    default: v0.1.0-rc.1
  command:
    description: "impact, diff, stats or parse"
    default: impact
  file:
    description: "the graph, for impact/stats/parse"
    default: ""
  before:
    description: "the graph as it was, for diff"
    default: ""
  after:
    description: "the graph as it is now, for diff"
    default: ""
  changed:
    description: "changed node ids, comma separated"
    default: ""
  profile:
    description: "terraform, dbt, cyclonedx or generic; detected from the file when empty"
    default: ""
  edge-semantics:
    description: "feeds or depends-on; the profile decides when empty"
    default: ""
  format:
    description: "dot or jgf; detected when empty"
    default: ""
  fail-if-reaches:
    description: "selector, e.g. group=production; repeatable with one per line"
    default: ""
  fail-on-new-reach:
    description: "selector judged against BEFORE, for diff; one per line"
    default: ""
  max-impacted:
    description: "fail when more than N nodes are impacted"
    default: ""
  fail-on:
    description: "fail on a condition; only 'cycle' today"
    default: ""
  explain:
    description: "show why each node is reached"
    default: "true"
  limit:
    description: "items per list in the comment; 0 shows everything"
    default: "10"
  comment:
    description: "post (and update) a pull-request comment"
    default: "true"
  comment-tag:
    description: "identifies the comment to update, so runs do not stack up"
    default: dagreach
  token:
    description: "token used to comment; needs pull-requests: write"
    default: ${{ github.token }}

outputs:
  verdict:
    description: "pass, fail, or unknown when a policy could not be settled"
    value: ${{ steps.run.outputs.verdict }}
  exit-code:
    description: >-
      0 ok, 1 a policy failed, 2 usage, 3 a policy could not be settled,
      4 the input could not be read
    value: ${{ steps.run.outputs.exit-code }}
  commented:
    description: >-
      true when the report was posted as a comment; false otherwise, including
      when commenting is off, the event is not a pull request, or the pull
      request comes from another repository
    value: ${{ steps.comment.outputs.commented || 'false' }}
  report:
    description: "path to the markdown report"
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    # The binary is downloaded, not built: installing Go and compiling on every
    # run costs seconds nobody asked for, and it means the gate that judged your
    # pull request is not the artifact anyone reviewed. A pinned version and a
    # checksum make the two the same thing.
    - name: Fetch dagreach
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS" in
          Linux)   os=linux ;;
          macOS)   os=darwin ;;
          Windows) os=windows ;;
          *) echo "::error::dagreach publishes no binary for $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::dagreach publishes no binary for $RUNNER_ARCH"; exit 1 ;;
        esac

        stem="dagreach_${VERSION#v}_${os}_${arch}"
        if [ "$os" = "windows" ]; then archive="$stem.zip"; else archive="$stem.tar.gz"; fi

        cd "$RUNNER_TEMP"
        gh release download "$VERSION" --repo MinganieTech/dagreach \
          --pattern "$archive" --pattern checksums.txt --clobber

        # The checksum comes from the same release, so it proves the download
        # arrived intact - not that the release is what its author meant to
        # publish. Pinning `version` to a tag you have looked at is what does
        # that, and it is why this input has no floating default.
        if command -v sha256sum > /dev/null; then
          grep " \*\?$archive\$" checksums.txt | sha256sum --check --strict -
        else
          shasum -a 256 --check --strict <(grep " \*\?$archive\$" checksums.txt)
        fi

        binary="dagreach"
        case "$archive" in
          *.zip) unzip -oq "$archive"; binary="dagreach.exe" ;;
          *)     tar -xzf "$archive"; chmod +x dagreach ;;
        esac
        # Windows keeps its extension rather than being renamed, so the later
        # step is told where the binary is instead of guessing.
        echo "DAGREACH_BIN=$RUNNER_TEMP/$binary" >> "$GITHUB_ENV"
        "$RUNNER_TEMP/$binary" --version

    - name: Run dagreach
      id: run
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_FILE: ${{ inputs.file }}
        INPUT_BEFORE: ${{ inputs.before }}
        INPUT_AFTER: ${{ inputs.after }}
        INPUT_CHANGED: ${{ inputs.changed }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_EDGE_SEMANTICS: ${{ inputs.edge-semantics }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_FAIL_IF_REACHES: ${{ inputs.fail-if-reaches }}
        INPUT_FAIL_ON_NEW_REACH: ${{ inputs.fail-on-new-reach }}
        INPUT_MAX_IMPACTED: ${{ inputs.max-impacted }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_EXPLAIN: ${{ inputs.explain }}
        INPUT_LIMIT: ${{ inputs.limit }}
      run: |
        set -uo pipefail
        args=("$INPUT_COMMAND")

        case "$INPUT_COMMAND" in
          diff)
            [ -n "$INPUT_BEFORE" ] && [ -n "$INPUT_AFTER" ] || {
              echo "::error::diff needs 'before' and 'after'"; exit 2; }
            args+=("$INPUT_BEFORE" "$INPUT_AFTER") ;;
          *)
            [ -n "$INPUT_FILE" ] || { echo "::error::$INPUT_COMMAND needs 'file'"; exit 2; }
            args+=("$INPUT_FILE") ;;
        esac

        [ -n "$INPUT_CHANGED" ] && args+=(--changed "$INPUT_CHANGED")
        [ -n "$INPUT_PROFILE" ] && args+=(--profile "$INPUT_PROFILE")
        [ -n "$INPUT_EDGE_SEMANTICS" ] && args+=(--edge-semantics "$INPUT_EDGE_SEMANTICS")
        [ -n "$INPUT_FORMAT" ] && args+=(--format "$INPUT_FORMAT")
        [ -n "$INPUT_MAX_IMPACTED" ] && args+=(--max-impacted "$INPUT_MAX_IMPACTED")
        [ -n "$INPUT_FAIL_ON" ] && args+=(--fail-on "$INPUT_FAIL_ON")
        # Only the two commands that reach something read --explain; passing it
        # to `stats` used to be dropped in silence and is now a usage error, so
        # the action has to know which commands read which flag. `parse` reads
        # neither: it reports what loaded, and there is nothing to limit.
        case "$INPUT_COMMAND" in
          impact|diff)
            [ "$INPUT_EXPLAIN" = "true" ] && args+=(--explain)
            args+=(--limit "$INPUT_LIMIT") ;;
          stats)
            args+=(--limit "$INPUT_LIMIT") ;;
        esac

        while IFS= read -r selector; do
          [ -n "$selector" ] && args+=(--fail-if-reaches "$selector")
        done <<< "$INPUT_FAIL_IF_REACHES"
        while IFS= read -r selector; do
          [ -n "$selector" ] && args+=(--fail-on-new-reach "$selector")
        done <<< "$INPUT_FAIL_ON_NEW_REACH"

        report="$RUNNER_TEMP/dagreach-report.md"
        echo "running: dagreach ${args[*]}"
        # `shell: bash` runs with -e, and a failing policy is exit 1 on purpose:
        # without this the step would die here and never comment.
        set +e
        "$DAGREACH_BIN" "${args[@]}" --markdown > "$report"
        code=$?
        set -e
        cat "$report"

        verdict=pass
        [ "$code" -eq 1 ] && verdict=fail
        [ "$code" -eq 3 ] && verdict=unknown
        {
          echo "exit-code=$code"
          echo "verdict=$verdict"
          echo "report=$report"
        } >> "$GITHUB_OUTPUT"

        cat "$report" >> "$GITHUB_STEP_SUMMARY"

        # 2 and 4 mean the run never happened; they fail here rather than be
        # reported as a clean gate. 3 is a verdict, not a failure to run, so it
        # goes on to comment like the others.
        if [ "$code" -eq 2 ] || [ "$code" -eq 4 ]; then
          echo "::error::dagreach could not run (exit $code)"
          exit "$code"
        fi
        if [ "$code" -eq 3 ]; then
          echo "::warning::a dagreach policy could not be settled by this graph - see the report"
        fi

    # A pull request whose head lives in another repository runs with a read-only
    # GITHUB_TOKEN, so posting would fail the job over a permission nobody can
    # grant from here. The report is already in the job summary, and the verdict
    # still gates the build, so the comment is the only thing skipped. Moving to
    # pull_request_target to get a writable token would run this workflow against
    # the fork's code with the base repository's secrets - not a trade worth a
    # comment.
    #
    # The test is where the head branch lives, not `head.repo.fork`: a repository
    # that is itself a fork sets that flag on its own internal pull requests,
    # where the token is perfectly writable. An empty head.repo means the fork was
    # deleted, which is also not somewhere we can comment.
    - name: Comment on the pull request
      id: comment
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ inputs.comment-tag }}
        REPORT: ${{ steps.run.outputs.report }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
          echo "commented=false" >> "$GITHUB_OUTPUT"
          echo "::notice::the head branch lives in ${HEAD_REPO:-a deleted repository}, so the token is read-only; the report stays in the job summary"
          exit 0
        fi
        marker="<!-- dagreach:$TAG -->"
        body="$(printf '%s\n\n%s\n' "$marker" "$(cat "$REPORT")")"

        # One comment per tag, updated in place: a gate that stacks up twenty
        # comments on a busy pull request is a gate people mute.
        existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
          --jq "[.[] | select(.body | startswith(\"$marker\"))] | first | .id // empty")

        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
            -f body="$body" > /dev/null
          echo "updated comment $existing"
        else
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            -f body="$body" > /dev/null
          echo "posted a new comment"
        fi
        echo "commented=true" >> "$GITHUB_OUTPUT"

    - name: Fail when a policy failed
      if: ${{ steps.run.outputs.exit-code == '1' }}
      shell: bash
      run: |
        echo "::error::a dagreach policy failed - see the report above"
        exit 1
