name: Release

# Builds the binaries a tag promises and attaches them to a GitHub Release.
#
# Cross-compilation happens on one runner because dagreach is pure Go with
# CGO_ENABLED=0: the binary a Linux runner produces for darwin/arm64 is the
# binary a Mac would have produced. What the three-OS CI matrix is for is running
# the tests on each system, which is a different question and already answered
# before a tag exists.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: The tag and the binary must claim the same version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared=$(go run ./cmd/dagreach --version | awk '{print $2}')
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, the binary says $declared"
            echo "set Version in internal/dagreach/cli.go before tagging"
            exit 1
          fi
          echo "both say $declared"

      - name: Refuse to overwrite a release that already exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::$GITHUB_REF_NAME is already released; a published artifact is not rewritten"
            exit 1
          fi

      - name: Build every platform the release promises
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # One line per published artifact: the names are the contract, so they
          # are written here rather than assembled from runner variables.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            stem="dagreach_${version}_${os}_${arch}"
            if [ "$os" = "windows" ]; then binary="dagreach.exe"; else binary="dagreach"; fi

            # -trimpath keeps build paths out of the binary, so two builds of the
            # same commit produce the same bytes.
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "dist/$binary" ./cmd/dagreach

            if [ "$os" = "windows" ]; then
              (cd dist && zip -q "${stem}.zip" "$binary" && rm "$binary")
            else
              (cd dist && tar -czf "${stem}.tar.gz" "$binary" && rm "$binary")
            fi
            echo "built $stem"
          done

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Anything with a hyphen in its version is a pre-release: -rc.1, -beta.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac

          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            $prerelease
